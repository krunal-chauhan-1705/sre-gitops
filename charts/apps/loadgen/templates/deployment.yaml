apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.image }}
          command: ["/bin/sh", "-c"]
          args:
            - while true; do curl -s -o /dev/null -w "%{http_code}\n" {{ .Values.target }}; sleep {{ .Values.intervalSeconds }}; done
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
