# Secrets are NOT created by this chart (GO-03): create `sre-agent-secrets` by hand (README).
# Keys: api_key (LangSmith), OPENROUTER_API_KEY, GITHUB_PAT, optional langgraph_cloud_license_key,
# later SLACK_BOT_TOKEN / SLACK_APP_TOKEN.

chatUi:
  enabled: true
  image:
    repository: sre-agent-chat-ui
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 20m, memory: 96Mi }
    limits: { memory: 384Mi }

# Shared by the API pod and the queue worker (AS-04). Anchors keep the two lists identical.
agentEnvFrom: &agentEnvFrom
  - secretRef: { name: sre-agent-secrets }
agentEnv: &agentEnv
  - { name: MODEL, value: "particle-ai/particle-1:free" }              # gate G-3 (smoke test passed)
  - { name: MODEL_FALLBACKS, value: "nvidia/nemotron-3-ultra-550b-a55b:free" }   # used on upstream 429
  - { name: FIX_MODEL, value: "" }                                      # empty = MODEL
  - { name: GITOPS_REPO, value: krunal-chauhan-1705/sre-gitops }      # PRs + history via the GitHub API
  - { name: GRAFANA_MCP_URL, value: "http://mcp-grafana.o11y.svc.cluster.local:8000/mcp" }
  - { name: K8S_MCP_URL, value: "http://mcp-kubernetes.o11y.svc.cluster.local:8080/mcp" }
  - { name: AGENT_EVENTS_URL, value: "http://sre-agent-api-server.sre-agent.svc.cluster.local/agent-events" }
  - { name: LANGSMITH_TRACING, value: "true" }
  - { name: LANGSMITH_PROJECT, value: sre-agent }
  - { name: LANGGRAPH_POSTGRES_POOL_MAX_SIZE, value: "10" }
  - { name: BG_JOB_TIMEOUT_SECS, value: "900" }

langgraph-cloud:
  fullnameOverride: sre-agent        # sre-agent-api-server, sre-agent-queue, sre-agent-postgres, sre-agent-redis
  images:
    apiServerImage:                  # `langgraph build` against minikube docker-env (sre-agents README)
      repository: sre-agent
      tag: "0.1.4"
      pullPolicy: IfNotPresent
  config:
    existingSecretName: sre-agent-secrets
    numberOfJobsPerWorker: 5         # AS-07
  apiServer:
    service:
      type: ClusterIP                # AS-06: the server has no auth
    deployment:
      replicaCount: 1
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { cpu: "1", memory: 768Mi }
      envFrom: *agentEnvFrom
      extraEnv: *agentEnv            # SLACK_SOCKET_MODE=true is added here in Phase 6 (AS-05), API only
      securityContext: { allowPrivilegeEscalation: false }
    pdb:
      enabled: false
  # AS-01/02/03: split mode. The API pod gets N_JOBS_PER_WORKER=0; runs execute here.
  queue:
    enabled: true
    deployment:
      replicaCount: 1
      terminationGracePeriodSeconds: 180
      resources:
        requests: { cpu: 200m, memory: 384Mi }
        limits: { cpu: "1", memory: 768Mi }
      envFrom: *agentEnvFrom
      extraEnv: *agentEnv
      # The sre-gitops repo, kept in sync by git-sync and mounted READ-ONLY into the worker
      # (where runs execute). The agent reads it as /gitops/...; fixes never write here,
      # they go through GitHub's API as PRs. Public repo: git-sync needs no credentials.
      volumes:
        - { name: gitops, emptyDir: { sizeLimit: 256Mi } }
      volumeMounts:
        - { name: gitops, mountPath: /git, readOnly: true }
      sidecars:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.4.0
          args:
            - --repo=https://github.com/krunal-chauhan-1705/sre-gitops
            - --ref=main
            - --root=/git
            - --link=main          # /git/main -> current commit (atomic symlink swap)
            - --depth=1
            - --period=30s
          volumeMounts:
            - { name: gitops, mountPath: /git }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true }
    autoscaling:
      enabled: false
  postgres:
    external:
      # ponytail: local-only demo; move to an existing secret before any shared cluster (AS-08).
      # The in-chart Postgres also takes its password from here (chart quirk).
      password: change-me
    statefulSet:
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { cpu: "1", memory: 512Mi }
      persistence:
        size: 2Gi
  redis:
    deployment:
      resources:
        requests: { cpu: 20m, memory: 32Mi }
        limits: { cpu: 500m, memory: 128Mi }
