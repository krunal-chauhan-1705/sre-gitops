# Wraps fluent/fluent-bit 0.57.9. Default inputs + kubernetes filter; output -> Loki.
fluent-bit:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 128Mi}
  config:
    outputs: |
      [OUTPUT]
          Name loki
          Match kube.*
          Host loki.o11y.svc.cluster.local
          Port 3100
          Labels job=fluentbit, $kubernetes['namespace_name'], $kubernetes['pod_name'], $kubernetes['container_name']
