# GO-07: log-based alerts: app errors (pulsar, voyager) and Kubernetes events. Label names are verified live (U-04).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rule-app-errors
  labels:
    loki_rule: ""
data:
  app-errors.yaml: |
    groups:
      - name: app-errors
        rules:
          - alert: AppErrorLogs
            expr: |
              label_replace(sum by (kubernetes_container_name) (count_over_time({kubernetes_namespace_name="default", kubernetes_container_name=~"pulsar|voyager"} |~ "Traceback|\" 50[0-9] " [5m])), "app", "$1", "kubernetes_container_name", "(.*)") > 3
            for: 1m
            labels:
              severity: warning
              namespace: default
            annotations:
              summary: "{{ `{{ $labels.kubernetes_container_name }}` }} logged {{ `{{ $value }}` }} errors/5xx in 5m"
---
# Kubernetes events (job="k8s-events", shipped by fluent-bit) for failures that only show up as
# events. Pod/node states with a kube-state-metrics series are alerted on in Prometheus instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rule-k8s-events
  labels:
    loki_rule: ""
data:
  k8s-events.yaml: |
    groups:
      - name: k8s-events
        rules:
          - alert: KubeWarningEvents
            expr: |
              label_replace(sum by (involvedObject_namespace, reason) (count_over_time({job="k8s-events", type="Warning", reason=~"FailedScheduling|FailedMount|FailedAttachVolume|FailedCreate|FailedCreatePodSandBox|FailedKillPod|FailedPostStartHook|FailedPreStopHook|Evicted|Preempting|NodeNotReady|Rebooted|SystemOOM|OOMKilling|EvictionThresholdMet|FreeDiskSpaceFailed|ImageGCFailed|ContainerGCFailed|InvalidDiskCapacity|NetworkNotReady|ProvisioningFailed|FailedBinding"} [10m])), "namespace", "$1", "involvedObject_namespace", "(.*)") > 0
            labels:
              severity: warning
            annotations:
              summary: "{{ `{{ $value }}` }} {{ `{{ $labels.reason }}` }} warning events in namespace {{ `{{ $labels.namespace }}` }} (10m)"
          - alert: PodProbeFailures
            expr: |
              label_replace(sum by (involvedObject_namespace) (count_over_time({job="k8s-events", type="Warning", reason="Unhealthy"} [10m])), "namespace", "$1", "involvedObject_namespace", "(.*)") > 5
            labels:
              severity: warning
            annotations:
              summary: "{{ `{{ $value }}` }} liveness/readiness probe failures in namespace {{ `{{ $labels.namespace }}` }} (10m)"
          - alert: ArgoCDAppProblem
            expr: |
              sum by (name) (count_over_time({job="k8s-events", involvedObject_kind="Application"} |~ "health status: .* -> (Degraded|Missing)|Sync operation to .* failed" | json name="involvedObject.name" [10m])) > 0
            labels:
              severity: warning
              namespace: argocd
            annotations:
              summary: "ArgoCD application {{ `{{ $labels.name }}` }} went Degraded/Missing or failed to sync"
