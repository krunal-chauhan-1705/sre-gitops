# GO-07: log-based alerts: app errors (pulsar, voyager) and Kubernetes events. Label names are verified live (U-04).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rule-app-errors
  labels:
    loki_rule: ""
data:
  app-errors.yaml: |
    groups:
      - name: app-errors
        rules:
          - alert: AppErrorLogs
            expr: |
              label_replace(sum by (kubernetes_container_name) (count_over_time({kubernetes_namespace_name="default", kubernetes_container_name=~"pulsar|voyager"} |~ "Traceback|\" 50[0-9] " [5m])), "app", "$1", "kubernetes_container_name", "(.*)") > 3
            for: 1m
            labels:
              severity: critical
              namespace: default
            annotations:
              summary: "{{ `{{ $labels.kubernetes_container_name }}` }} logged {{ `{{ $value }}` }} errors/5xx in 5m"
---
# Kubernetes events (job="k8s-events", shipped by fluent-bit) for failures that only show up as
# events. Pod/node states with a kube-state-metrics series are alerted on in Prometheus instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rule-k8s-events
  labels:
    loki_rule: ""
data:
  k8s-events.yaml: |
    groups:
      - name: k8s-events
        rules:
          - alert: KubeWarningEvents
            expr: |
              label_replace(sum by (involvedObject_namespace, reason) (count_over_time({job="k8s-events", type="Warning", reason=~"FailedScheduling|FailedMount|FailedAttachVolume|FailedCreate|FailedCreatePodSandBox|FailedKillPod|FailedPostStartHook|FailedPreStopHook|Evicted|NodeNotReady|Rebooted|SystemOOM|OOMKilling|EvictionThresholdMet|NetworkNotReady|ProvisioningFailed|FailedBinding"} [10m])), "namespace", "$1", "involvedObject_namespace", "(.*)") > 0
            labels:
              severity: warning
            annotations:
              summary: "{{ `{{ $value }}` }} {{ `{{ $labels.reason }}` }} warning events in namespace {{ `{{ $labels.namespace }}` }} (10m)"
          - alert: KubeInfoEvents
            expr: |
              label_replace(sum by (involvedObject_namespace, reason) (count_over_time({job="k8s-events", type="Warning", reason=~"Preempting|ImageGCFailed|ContainerGCFailed|InvalidDiskCapacity|FreeDiskSpaceFailed"} [10m])), "namespace", "$1", "involvedObject_namespace", "(.*)") > 0
            labels:
              severity: info
            annotations:
              summary: "{{ `{{ $value }}` }} {{ `{{ $labels.reason }}` }} housekeeping events in namespace {{ `{{ $labels.namespace }}` }} (10m)"
          - alert: PodProbeFailures
            expr: |
              label_replace(sum by (involvedObject_namespace) (count_over_time({job="k8s-events", type="Warning", reason="Unhealthy"} [10m])), "namespace", "$1", "involvedObject_namespace", "(.*)") > 5
            labels:
              severity: info
            annotations:
              summary: "{{ `{{ $value }}` }} liveness/readiness probe failures in namespace {{ `{{ $labels.namespace }}` }} (10m)"
          - alert: ArgoCDAppProblem
            expr: |
              sum by (name) (count_over_time({job="k8s-events", involvedObject_kind="Application"} |~ "health status: .* -> (Degraded|Missing)" | json name="involvedObject.name" [10m])) > 0
            labels:
              severity: warning
              namespace: argocd
            annotations:
              summary: "ArgoCD application {{ `{{ $labels.name }}` }} went Degraded or Missing"
          # A commit the Kubernetes API rejects never deploys: the live app keeps the old version, so no
          # pod alert fires. The controller logs "Skipping auto-sync: failed previous sync attempt" on
          # every reconcile (~3 min) while stuck, so this stays firing until a good commit syncs.
          # "Retrying operation. Attempt #3+" fires it ~1-2 min after the commit instead of after
          # ArgoCD's 5 retries (~7 min); transient failures normally succeed on retry 1-2.
          - alert: ArgoCDSyncFailing
            expr: |
              sum by (application) (count_over_time({kubernetes_namespace_name="argocd", kubernetes_container_name="application-controller"} |~ "Skipping auto-sync: failed previous sync attempt|Sync operation to [^ ]+ failed|Retrying operation. Attempt #([3-9]|[1-9][0-9])" | json log="log" | line_format "{{ `{{.log}}` }}" | logfmt [15m])) > 0
            labels:
              severity: warning
              namespace: argocd
            annotations:
              summary: "ArgoCD cannot sync application {{ `{{ $labels.application }}` }}: its last commit was rejected and never deployed"
