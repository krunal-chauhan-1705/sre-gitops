# argo/argo-cd 10.18.3, installed once by hand (D-09):
#   helm install argocd argo/argo-cd --version 10.18.3 -n argocd --create-namespace -f bootstrap/argocd-values.yaml
# Trimmed for a 4 CPU / 5GB minikube: no dex, notifications or applicationset.
configs:
  params:
    server.insecure: true        # UI via kubectl port-forward only
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0
controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}
repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
server:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
redis:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
