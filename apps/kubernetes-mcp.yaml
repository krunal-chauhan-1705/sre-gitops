apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-mcp
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]   # delete its resources with the app
spec:
  project: default
  source:
    repoURL: https://github.com/krunal-chauhan-1705/sre-gitops.git
    targetRevision: main
    path: charts/infra/kubernetes-mcp
    helm:
      releaseName: kubernetes-mcp
  destination:
    server: https://kubernetes.default.svc
    namespace: o11y
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
