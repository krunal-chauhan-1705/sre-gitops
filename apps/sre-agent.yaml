apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sre-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/krunal-chauhan-1705/sre-gitops.git
    targetRevision: main
    path: charts/infra/sre-agent
    helm:
      releaseName: sre-agent
  destination:
    server: https://kubernetes.default.svc
    namespace: sre-agent
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
