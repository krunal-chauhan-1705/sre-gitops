apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voyager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/krunal-chauhan-1705/sre-gitops.git
    targetRevision: main
    path: charts/apps/voyager
    helm:
      releaseName: voyager
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
