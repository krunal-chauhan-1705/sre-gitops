apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/krunal-chauhan-1705/sre-gitops.git
    targetRevision: main
    path: charts/infra/fluent-bit
    helm:
      releaseName: fluent-bit
  destination:
    server: https://kubernetes.default.svc
    namespace: o11y
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
